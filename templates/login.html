<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accesso - Falegnameria</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4">

    <!-- BOX DI ACCESSO -->
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl border border-slate-200 p-8 space-y-6">
        
        <!-- INTESTAZIONE -->
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-900 text-white text-xl mb-1 shadow">
                🪵
            </div>
            <h1 class="text-xl font-bold tracking-wide text-slate-900">Falegnameria</h1>
            <p class="text-xs text-slate-500">Accedi al gestionale cantieri e presenze</p>
        </div>

        <!-- ALERT ERRORE CREDENZIALI -->
        {% if error %}
        <div class="bg-rose-500 text-white text-xs px-4 py-3 rounded-lg text-center font-medium shadow">
            ⚠️ Credenziali non valide. Riprova.
        </div>
        {% endif %}

        <!-- FORM DI LOGIN -->
        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Nome Utente</label>
                <input type="text" name="username" required placeholder="Username" class="w-full text-sm border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full text-sm border border-slate-300 rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
            </div>

            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium text-sm py-3 rounded-lg shadow-md transition flex justify-center items-center gap-2">
                Accedi al Sistema
            </button>
        </form>

        <!-- FOOTER INFORMATIVO RAPIDO -->
        <div class="border-t border-slate-100 pt-4 text-center">
            <p class="text-[11px] text-slate-400">
                Sistema riservato al personale autorizzato.
            </p>
        </div>

    </div>

</body>
</html>
</html>
